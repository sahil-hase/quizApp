<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="quiz-container">
        <button id="generate" onclick="generateQuiz()">Generate Quiz</button>
        <button id="start" style="display: none;" onclick="startQuiz()">Start Quiz</button>
        <div id="quiz" class="quiz-header">
            <h2 id="question">Question text</h2>
            <div class="answers">
                <button onclick="selectAnswer(0)" id="btn0">Answer 1</button>
                <button onclick="selectAnswer(1)" id="btn1">Answer 2</button>
                <button onclick="selectAnswer(2)" id="btn2">Answer 3</button>
                <button onclick="selectAnswer(3)" id="btn3">Answer 4</button>
            </div>
        </div>
        <div id="result" class="result" style="display: none;"></div>
        <div id="correct-answers" class="correct-answers" style="display: none;"></div>
        <button id="restart" style="display: none;" onclick="restartQuiz()">Restart Quiz</button>
    </div>
</body>
<script src="script.js"></script>

</html>
